name = "my_lean_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Triangle", "Blog", "generate-blog"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Triangle"

[[lean_exe]]
name = "triangle"
root = "Main"

[[lean_exe]]
name = "svgtest"
root = "SvgTest"

[[lean_lib]]
name = "Blog"

[[lean_exe]]
name = "generate-blog"
root = "BlogMain"
