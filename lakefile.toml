name = "my_lean_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Triangle", "Blog", "generate-blog"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
# Match the tag to the Lean version in your lean-toolchain (omit the 'leanprover/lean4:' prefix)
# https://github.com/leanprover/verso/releases
rev = "v4.35.0" # or use main for latest version

# put last so that Mathlib's versions take precedence
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"   # Or pin your matching Lean tag: "v4.35.0"

[[lean_lib]]
name = "Triangle"

[[lean_exe]]
name = "triangle"
root = "Main"

[[lean_exe]]
name = "svgtest"
root = "SvgTest"

[[lean_lib]]
name = "Blog"

[[lean_exe]]
name = "generate-blog"
root = "BlogMain"
